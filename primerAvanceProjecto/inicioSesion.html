<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <header>
            <h1>Inicio de sesion</h1>
            <p class="subtitulo">Complete todos los campos obligatorios para crear su cuenta.</p>
        </header>

        <form action="" novalidate>
            <!-- Nombre -->
             <div>
                <label for="nombre">Nombre completo</label>
                <span aria-hidden="true">*</span>

                <div>
                    <input type="text" id="nombre" placeholder="ej. Maria Perez"
                    aria-describedby="ayuda nombre" required aria-required="true">
                    <span id="ayuda nombre" class="texto-oculto">Ingrese su nombre 
                    completo (minimo 5 caracteres), por ejemplo: Maria Perez</span>
                </div>
             </div>

            <!-- correo -->
              <div>
                <label for="correo">Correo</label>
                <span aria-hidden="true">*</span>

                <div>
                    <input type="email" id="correo" placeholder="ej. usuario@ucenfotec.ac.cr" 
                    aria-describedby="ayuda-correo" required aria-required="true">
                    <span id="ayuda-correo" class="texto-oculto">Ingrese su correo 
                    institucional, por ejemplo: usuario@ucenfotec.ac.cr</span>
                </div>
            </div>

            <!-- contraseña -->
            <div>
                <label for="contrasenna">Contraseña</label>
                <span aria-hidden="true" class="label-requerido">*</span>

                <div>
                    <input type="password" id="contrasenna" required aria-required="true">
                </div> 

            </div>
        
            <!-- verificacion -->

            <div>
                <label for="verificacion-contrasenna">Confirmar contraseña</label>
                <span aria-required="true" class="label-requerido">*</span>

                <div>
                    <input type="password" id="verificacion-contrasenna" required
                    aria-required="true" aria-describedby="ayuda-confirmacion-contrasenna">
                    
                    <span id="ayuda-confirmacion-contrasenna" class="texto oculto">Vuelva
                    a escribir la misma contraseña.</span>
                </div>
            </div>

            <button id="crear-cuenta">Crear cuenta</button>

        </form>

    </main>

</body>

</html>
