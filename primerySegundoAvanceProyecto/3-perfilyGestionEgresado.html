<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Perfil de Egresado</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <header>
    <h1>Perfil y Gestion de Egresado</h1>
    <nav>
      <ul>
        <li><a href="1-paginaInicio.html">Inicio</a></li>
        <li><a href="2-Inicio-de-sesion.html">Iniciar Sesión</a></li>
        <li><a href="3-perfilyGestionEgresado.html">Perfil y Gestión de Egresado</a></li>
        <li><a href="4-carreras.html">Carreras</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <article>
        <h2>Registrar egresado</h2>
        <form id="formEgresado">
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" required>
          <span class="error" id="errorNombre"></span>

          <label for="correo">Correo:</label>
          <input type="email" id="correo" name="correo" required>
          <span class="error" id="errorCorreo"></span>

          <label for="telefono">Teléfono:</label>
          <input type="tel" id="telefono" name="telefono" required>
          <span class="error" id="errorTelefono"></span>

          <button type="submit">Guardar</button>
        </form>
      </article>

      <article>
        <h2>Lista de egresados</h2>
        <table id="tablaEgresados">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Teléfono</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <!-- Aquí se insertarán los egresados -->
          </tbody>
        </table>
      </article>
    </section>
  </main>

  <script src="egresados.js"></script>
</body>
</html>
