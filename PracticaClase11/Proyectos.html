<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Proyectos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Gestión de Proyectos</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="login.html">Iniciar Sesión</a></li>
        <li><a href="perfil.html">Perfil</a></li>
        <li><a href="carreras.html">Carreras</a></li>
        <li><a href="proyectos.html">Proyectos</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <article>
        <h2>Registrar nuevo proyecto</h2>
        <form id="formProyecto">
          <label for="nombre">Nombre del proyecto:</label>
          <input type="text" id="nombre" name="nombre" required>
          <span class="error" id="errorNombre"></span>

          <label for="fecha_inicio">Fecha de inicio:</label>
          <input type="date" id="fecha_inicio" name="fecha_inicio" required>
          <span class="error" id="errorFecha"></span>

          <label for="estado">Estado:</label>
          <select id="estado" name="estado" required>
            <option value="">Seleccione un estado</option>
            <option value="En curso">En curso</option>
            <option value="Finalizado">Finalizado</option>
            <option value="Detenido">Detenido</option>
            <option value="Pendiente">Pendiente</option>
            <option value="Cancelado">Cancelado</option>
          </select>
          <span class="error" id="errorEstado"></span>

          <button type="submit">Guardar</button>
        </form>
      </article>

      <article>
        <h2>Lista de proyectos</h2>
        <table id="tablaProyectos">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Fecha de inicio</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>
            <!-- Aquí se insertarán los proyectos -->
          </tbody>
        </table>
      </article>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Universidad CENFOTEC</p>
  </footer>

  <script src="proyectos.js"></script>
</body>
</html>
